<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NomadDeck · 集群运维控制面</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('nd_theme');
          var theme =
            savedTheme === 'dark' || savedTheme === 'light'
              ? savedTheme
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-S5vvwi6p.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DL1VXl80.css">
  </head>
  <body class="bg-[#f5f7fb] text-slate-800 dark:bg-[#0b1120] dark:text-slate-100 antialiased">
    <div id="root"></div>
  </body>
</html>
